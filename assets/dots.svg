<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>
    .coral { animation: swapL 12s linear infinite; }
    .blue  { animation: swapR 12s linear infinite; }
    @keyframes swapL {
      0%, 49.99%   { transform: translate(0, 0); }
      50%, 99.99%  { transform: translate(44px, 0); }
      100%         { transform: translate(0, 0); }
    }
    @keyframes swapR {
      0%, 49.99%   { transform: translate(0, 0); }
      50%, 99.99%  { transform: translate(-44px, 0); }
      100%         { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .coral, .blue { animation: none; }
    }
  </style>
  <circle class="coral" cx="28" cy="50" r="15" fill="#FF7A72"/>
  <circle class="blue" cx="72" cy="50" r="15" fill="#5E8CE6"/>
</svg>
